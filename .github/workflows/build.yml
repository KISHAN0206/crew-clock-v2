name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put files into their folders
        run: |
          mkdir -p lib/data lib/screens lib/util test tool
          mvif() { [ -f "$1" ] && mv "$1" "$2" || true; }
          mvif main.dart lib/
          mvif ui.dart lib/
          mvif models.dart lib/data/
          mvif store.dart lib/data/
          mvif sync.dart lib/data/
          mvif kiosk_screen.dart lib/screens/
          mvif manager_screen.dart lib/screens/
          mvif camera_screen.dart lib/screens/
          mvif sync_settings.dart lib/screens/
          mvif format.dart lib/util/
          mvif hours.dart lib/util/
          mvif security.dart lib/util/
          mvif hours_test.dart test/
          mvif setup.dart tool/
          mvif brand.py tool/
          find lib test tool -type f

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files and add camera settings
        run: dart run tool/setup.dart

      - name: Add Jaybel Office Choice branding (logo, icon, launch screen)
        run: |
          mkdir -p assets/brand
          B=https://jaybel.officechoice.com.au/Themes/BPDTHEME01/theme-client-updates
          [ -f logo-white.png ] || curl -fsSL -A "Mozilla/5.0" -o assets/brand/logo-white.png "$B/img/logos/logo-wide-transparent.png" || echo "white logo download failed"
          [ -f logo-red.png ] || curl -fsSL -A "Mozilla/5.0" -o assets/brand/logo-red.png "$B/img/logos/logo-wide.png" || echo "red logo download failed"
          [ -f icon.png ] || curl -fsSL -A "Mozilla/5.0" -o assets/brand/icon.png "$B/apple-touch-icon.png" || echo "icon download failed"
          pip install --quiet pillow
          python3 tool/brand.py
          ls -la assets/brand

      - name: Build all plugins against Android SDK 36
        run: |
          cd android
          if [ -f build.gradle.kts ]; then
            cat > /tmp/fix.gradle <<'KTS'
          // Crew Clock: some plugins still target an older Android SDK. Build them against SDK 36.
          subprojects {
              if (name != "app") {
                  afterEvaluate {
                      extensions.findByName("android")?.withGroovyBuilder { "compileSdkVersion"(36) }
                  }
              }
          }

          KTS
            cat /tmp/fix.gradle build.gradle.kts > /tmp/root.gradle && mv /tmp/root.gradle build.gradle.kts
          else
            cat > /tmp/fix.gradle <<'GROOVY'
          // Crew Clock: some plugins still target an older Android SDK. Build them against SDK 36.
          subprojects { sub ->
              if (sub.name != "app") {
                  sub.afterEvaluate { p -> if (p.hasProperty("android")) { p.android.compileSdkVersion 36 } }
              }
          }

          GROOVY
            cat /tmp/fix.gradle build.gradle > /tmp/root.gradle && mv /tmp/root.gradle build.gradle
          fi
          head -12 build.gradle*

      - name: Sign with the permanent Crew Clock key
        env:
          CREWCLOCK_KEYSTORE: ${{ secrets.CREWCLOCK_KEYSTORE }}
        run: |
          if [ -z "$CREWCLOCK_KEYSTORE" ]; then
            echo "::warning::CREWCLOCK_KEYSTORE secret is missing. This APK uses a temporary key and won't install over an existing Crew Clock."
            exit 0
          fi
          echo "$CREWCLOCK_KEYSTORE" | base64 -d > android/app/crewclock.jks
          python3 tool/signing.py

      - name: Build APK
        env:
          CREWCLOCK_KEY_PASSWORD: ${{ secrets.CREWCLOCK_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          echo "Signing certificate:"
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -E "SHA256|Owner" || true

      - name: Build smaller APKs for each chip type
        env:
          CREWCLOCK_KEY_PASSWORD: ${{ secrets.CREWCLOCK_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi
          mkdir -p tablet-apks
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "tablet-apks/crew-clock-32bit.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "tablet-apks/crew-clock-64bit.apk"
          ls -la tablet-apks

      - name: Upload tablet APKs (one per chip type)
        uses: actions/upload-artifact@v4
        with:
          name: crew-clock-tablet-apks
          path: tablet-apks/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crew-clock-apk
          path: build/app/outputs/flutter-apk/app-release.apk
